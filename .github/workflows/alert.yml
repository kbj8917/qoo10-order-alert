on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: seen_orders.json
          key: s-${{ github.run_id }}
          restore-keys: s-
      - run: python qoo10_alert.txt
        env:
          S: ${{ toJSON(secrets) }}
